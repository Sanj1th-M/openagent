[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent"
version = "57.0"
description = "openagent — Personal Voice AI & Holographic Assistant"
authors = [
    {name = "Sanj1th"},
    {name = "FatihMakes"}
]
readme = "readme.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"

[tool.setuptools]
packages = ["gui", "core", "memory", "actions", "plugins", "providers"]
py-modules = ["main", "ui", "setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
